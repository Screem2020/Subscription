databaseChangeLog:

  - changeSet:
      id: create-user-subscription-entity
      author: misha

      changes:

        - createTable:
            tableName: subscription_entity

            columns:

              - column:
                  name: login
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: subscription_type
                  type: varchar(50)
                  constraints:
                    nullable: false

              - column:
                  name: expires_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false